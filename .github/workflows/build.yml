# Playable builds for macOS, Windows and Linux: on a version tag (v*) they are attached to a GitHub
# release; "Run workflow" builds them as artifacts. Each carries the shipped packs (Kvissentali,
# Palupera) and the tile-service sidecar (tools/service, PyInstaller), so a build creates worlds for
# any address by itself; the Windows sidecar is built on Windows, the others on their own platform.
# LFS objects (models, textures, Terrain3D binaries, ~450 MB) are cached between runs and
# platforms so a build does not spend the LFS bandwidth quota; the export presets exclude the
# vendored source scenes the game never loads.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2

defaults:
  run:
    shell: bash   # the Windows runner would otherwise run the steps in PowerShell

jobs:
  export:
    name: ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: macOS
            os: macos-latest
            path: build/Vakuraamat-macos.zip
            artifact: Vakuraamat-macos
          - preset: Windows Desktop
            os: windows-latest
            path: build/windows/Vakuraamat.exe
            artifact: Vakuraamat-windows
          - preset: Linux
            os: ubuntu-latest
            path: build/linux/Vakuraamat.x86_64
            artifact: Vakuraamat-linux
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: LFS object cache
        id: lfs-cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.gitattributes') }}-${{ hashFiles('**/*.glb', 'assets/**/*.png', 'assets/**/*.jpg', 'assets/**/*.r32', 'assets/models/trees/*.res', 'addons/terrain_3d/bin/**') }}
          restore-keys: lfs-
      - name: "LFS pull (without the vendored source scenes the export excludes)"
        run: |
          git lfs install --local
          git lfs pull --exclude="assets/vendor/forest_vegetation/Scenes/**,assets/vendor/forest_vegetation/Models/**"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Tile-service sidecar (PyInstaller: the pipeline with rasterio, pyogrio, shapely, pyproj)"
        run: |
          python -m pip install -q -r tools/service/requirements.txt
          python -m PyInstaller --clean --noconfirm --distpath dist --workpath build/pyinstaller tools/service/tile_service.spec
          ls -la dist
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          include-templates: true
          use-dotnet: false
      - name: "Import (two passes: the first registers classes and Terrain3D)"
        run: |
          godot --headless --path . --import || true
          godot --headless --path . --import || true
      - name: Export ${{ matrix.preset }}
        run: |
          mkdir -p "$(dirname '${{ matrix.path }}')"
          godot --headless --path . --export-release "${{ matrix.preset }}" "${{ matrix.path }}"
          ls -la "$(dirname '${{ matrix.path }}')"
      - name: "Bundle (Windows and Linux: the executable, its pck and the sidecar)"
        if: matrix.preset != 'macOS'
        run: |
          cp dist/tile_service* "$(dirname '${{ matrix.path }}')/"
          cd "$(dirname '${{ matrix.path }}')"
          if command -v zip >/dev/null; then zip -r "../${{ matrix.artifact }}.zip" .; else 7z a -tzip "../${{ matrix.artifact }}.zip" .; fi
          cd - && ls -la build
      - name: "Bundle (macOS: the sidecar into the app bundle)"
        if: matrix.preset == 'macOS'
        run: |
          rm -rf build/mac && mkdir -p build/mac && cd build/mac && unzip -q "../../${{ matrix.path }}"
          cp ../../dist/tile_service Vakuraamat.app/Contents/MacOS/ && chmod +x Vakuraamat.app/Contents/MacOS/tile_service
          codesign --force --deep --sign - Vakuraamat.app || true
          rm -f "../../${{ matrix.path }}" && zip -qry "../../${{ matrix.path }}" Vakuraamat.app && cd ../.. && ls -la build
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.preset == 'macOS' && matrix.path || format('build/{0}.zip', matrix.artifact) }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Attach the builds to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.zip
          body: |
            Playable builds with the shipped packs and the tile-service sidecar (any address in Estonia
            becomes a world from the Locations page). macOS: the app is not notarised; after unzipping run
            `xattr -dr com.apple.quarantine Vakuraamat.app` once, or right-click and Open.

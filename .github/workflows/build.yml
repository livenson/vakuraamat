# Playable builds for macOS, Windows and Linux: on a version tag (v*) they are attached to a GitHub
# release; "Run workflow" builds them as artifacts. Each carries the shipped packs (Kvissentali,
# Palupera) and the tile-service sidecar (tools/service, PyInstaller), so a build creates worlds for
# any address by itself; the Windows sidecar is built on Windows, the others on their own platform.
# LFS objects (models, textures, Terrain3D binaries, ~450 MB) are cached between runs and
# platforms so a build does not spend the LFS bandwidth quota; the export presets exclude the
# vendored source scenes the game never loads.
name: build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2

defaults:
  run:
    shell: bash   # the Windows runner would otherwise run the steps in PowerShell

jobs:
  export:
    name: ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - preset: macOS
            os: macos-latest
            path: build/Vakuraamat-macos.zip
            artifact: Vakuraamat-macos
          - preset: Windows Desktop
            os: windows-latest
            path: build/windows/Vakuraamat.exe
            artifact: Vakuraamat-windows
          - preset: Linux
            os: ubuntu-latest
            path: build/linux/Vakuraamat.x86_64
            artifact: Vakuraamat-linux
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: LFS object cache
        id: lfs-cache
        uses: actions/cache@v4
        with:
          path: .git/lfs
          key: lfs-${{ hashFiles('.gitattributes') }}-${{ hashFiles('**/*.glb', 'assets/**/*.png', 'assets/**/*.jpg', 'assets/**/*.r32', 'assets/models/trees/*.res', 'addons/terrain_3d/bin/**') }}
          restore-keys: lfs-
      - name: "LFS pull (without the vendored source scenes the export excludes)"
        run: |
          git lfs install --local
          git lfs pull --exclude="assets/vendor/forest_vegetation/Scenes/**,assets/vendor/forest_vegetation/Models/**"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: "Tile-service sidecar (PyInstaller: the pipeline with rasterio, pyogrio, shapely, pyproj)"
        run: |
          python -m pip install -q -r tools/service/requirements.txt
          python -m PyInstaller --clean --noconfirm --distpath dist --workpath build/pyinstaller tools/service/tile_service.spec
          ls -la dist
      - name: "Smoke test the sidecar (it must answer, and reach Maa-amet over https)"
        run: |
          # v0.2.0 to v0.4.0 shipped a sidecar with no CA bundle: it started and answered /health,
          # but every https call failed to verify, so no world could be made from a build. /health
          # alone would not have caught it - the geocode is the test that matters.
          svc=dist/tile_service; [ -x "$svc" ] || svc=dist/tile_service.exe
          "$svc" --port 8765 --workspace "$RUNNER_TEMP/svc" --raw-dir "$RUNNER_TEMP/svc/raw" &
          for _ in $(seq 1 90); do curl -sf -m 2 http://127.0.0.1:8765/health >/dev/null && break; sleep 1; done
          curl -sf -m 20 http://127.0.0.1:8765/health || { echo "the sidecar never answered"; exit 1; }
          out=$(curl -sf -m 60 "http://127.0.0.1:8765/geocode?q=Haapsalu") || { echo "geocode request failed"; exit 1; }
          echo "$out" | head -c 300; echo
          case "$out" in *'"x"'*) echo "sidecar reaches Maa-amet";; *) echo "the sidecar cannot reach Maa-amet: $out"; exit 1;; esac
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: ${{ env.GODOT_VERSION }}
          include-templates: true
          use-dotnet: false
      - name: "Import (two passes: the first registers classes and Terrain3D)"
        run: |
          godot --headless --path . --import || true
          godot --headless --path . --import || true
      - name: "Bake the shipped places' ground (region data and vegetation, so a first launch does not build them)"
        run: |
          # assets/terrain/*/data is generated, not committed: made here from the committed inputs,
          # exactly as make tile does, and exported with the pack (the presets include vegetation.ok)
          for d in sites/*/; do
            s=$(basename "$d")
            t=$(python -c "import json,sys; print(json.load(open(sys.argv[1]))['terrain'].get('tile', sys.argv[2]))" "$d/site.json" "$s")
            godot --headless --path . -s res://tools/godot/import_terrain.gd -- --site="$s" --tile="$t"
            godot --headless --path . -s res://tools/godot/scatter_vegetation.gd -- --site="$s" --tile="$t"
            if [ ! -f "assets/terrain/$t/data/terrain3d_00_00.res" ] || [ ! -f "assets/terrain/$t/data/vegetation.ok" ]; then
              echo "$s: the ground did not bake"
              exit 1
            fi
          done
          godot --headless --path . --import || true
      - name: "Metal toolchain (macOS: the shader baker compiles .metallib with it)"
        if: matrix.preset == 'macOS'
        run: |
          # Xcode 26 ships the Metal compiler as a separate component. Without it the baker stores
          # Metal source, and every player's first launch compiles it: 25 s of frozen frames on entering
          # a world (v0.8.0, perf.log 2026-09-11)
          xcrun -sdk macosx metal -v >/dev/null 2>&1 || xcodebuild -downloadComponent MetalToolchain
          xcrun -sdk macosx metal -v
      - name: Export ${{ matrix.preset }}
        run: |
          mkdir -p "$(dirname '${{ matrix.path }}')"
          if [ "${{ matrix.preset }}" = "macOS" ]; then
            # the shader baker needs a rendering device, which --headless does not create
            godot --path . --export-release "${{ matrix.preset }}" "${{ matrix.path }}" 2>&1 | tee export.log
            if grep -q "Metal shader baking limited to SPIR-V" export.log; then
              echo "::warning::the macOS build ships unbaked Metal shaders; its first launch compiles them"
            fi
          else
            godot --headless --path . --export-release "${{ matrix.preset }}" "${{ matrix.path }}"
          fi
          ls -la "$(dirname '${{ matrix.path }}')"
      - name: "Bundle (Windows and Linux: the executable, its pck and the sidecar)"
        if: matrix.preset != 'macOS'
        run: |
          cp dist/tile_service* "$(dirname '${{ matrix.path }}')/"
          cd "$(dirname '${{ matrix.path }}')"
          if command -v zip >/dev/null; then zip -r "../${{ matrix.artifact }}.zip" .; else 7z a -tzip "../${{ matrix.artifact }}.zip" .; fi
          cd - && ls -la build
      - name: "Bundle (macOS: the sidecar into the app bundle)"
        if: matrix.preset == 'macOS'
        run: |
          rm -rf build/mac && mkdir -p build/mac && cd build/mac && unzip -q "../../${{ matrix.path }}"
          cp ../../dist/tile_service Vakuraamat.app/Contents/MacOS/ && chmod +x Vakuraamat.app/Contents/MacOS/tile_service
          codesign --force --deep --sign - Vakuraamat.app || true
          rm -f "../../${{ matrix.path }}" && zip -qry "../../${{ matrix.path }}" Vakuraamat.app && cd ../.. && ls -la build
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.preset == 'macOS' && matrix.path || format('build/{0}.zip', matrix.artifact) }}
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the tag's message and the commits since the previous tag make the notes
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: "Name the builds after the release (Vakuraamat-v1.2.3-macos.zip)"
        shell: bash
        run: |
          for f in dist/*/*.zip; do
            mv "$f" "$(dirname "$f")/$(basename "$f" .zip | sed "s/^Vakuraamat-/Vakuraamat-${GITHUB_REF_NAME}-/").zip"
          done
          ls -la dist/*
      - name: "Release notes: the release's changelog entry, the commits since the previous tag, how to run"
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          # checkout leaves the tag lightweight, and %(contents) then prints the commit message
          # instead of the annotation: fetch the tag object itself
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}" || true
          prev=$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)
          # CHANGELOG.md is where a release is described for players; the tag's message stands in
          # when the entry is missing
          awk -v tag="$tag" '$0 ~ "^## " tag "([^0-9.]|$)" {found=1; next} found && /^## / {exit} found {print}' CHANGELOG.md > entry.md || true
          {
            if [ -s entry.md ]; then cat entry.md; else git tag -l --format='%(contents)' "$tag"; fi
            echo
            if [ -n "$prev" ]; then
              echo "## Commits since $prev"
              echo
              # the first sentence of each subject: a full stop or semicolon before a capital, so
              # CHANGELOG.md and perf.prev.log keep their names; long ones are cut at a word
              git log --format='- %s' "$prev..$tag" \
                | sed -E 's/([.;]) [A-Z(].*$/\1/' \
                | sed -E 's/^(.{150}[^ ]*) .*/\1 …/'
              echo
            fi
            echo "## Builds"
            echo
            echo "Playable builds with the shipped packs and the tile-service sidecar (any address in Estonia becomes a world from the Locations page). macOS: the app is not notarised; after unzipping run \`xattr -dr com.apple.quarantine Vakuraamat.app\` once, or right-click and Open."
          } > notes.md
          cat notes.md
      - name: Attach the builds to the release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*.zip
          body_path: notes.md
